    <!-- SVG Filters for Real-Time Liquid Glass Optical Refraction (Turbulence + Displacement Map) -->
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;" version="1.1" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Dynamic Precise Liquid Glass Filter (Scale adjusted precisely via Refraction Height Slider) -->
        <filter id="liquid-glass-dynamic" x="-30%" y="-30%" width="160%" height="160%">
          <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.016" numOctaves="2" result="macroLens" seed="77" />
          <feComponentTransfer in="macroLens" result="lensDisplacement">
            <feFuncR type="linear" slope="1.45" intercept="-0.225" />
            <feFuncG type="linear" slope="1.45" intercept="-0.225" />
          </feComponentTransfer>
          <feDisplacementMap id="liquid-glass-dynamic-map" in="SourceGraphic" in2="lensDisplacement" scale="40" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Crystal Clear Lens (High clarity, anisotropic peripheral edge-stretch & optical refraction) -->
        <filter id="liquid-glass-crystal-subtle" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.015" numOctaves="2" result="noise" seed="42" />
          <feComponentTransfer in="noise" result="stretchedNoise">
            <feFuncR type="linear" slope="1.30" intercept="-0.15" />
            <feFuncG type="linear" slope="1.30" intercept="-0.15" />
          </feComponentTransfer>
          <feDisplacementMap in="SourceGraphic" in2="stretchedNoise" scale="14" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="liquid-glass-crystal-medium" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.003 0.016" numOctaves="2" result="noise" seed="42" />
          <feComponentTransfer in="noise" result="stretchedNoise">
            <feFuncR type="linear" slope="1.45" intercept="-0.225" />
            <feFuncG type="linear" slope="1.45" intercept="-0.225" />
          </feComponentTransfer>
          <feDisplacementMap in="SourceGraphic" in2="stretchedNoise" scale="22" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="liquid-glass-crystal-bold" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.018" numOctaves="2" result="noise" seed="42" />
          <feComponentTransfer in="noise" result="stretchedNoise">
            <feFuncR type="linear" slope="1.60" intercept="-0.30" />
            <feFuncG type="linear" slope="1.60" intercept="-0.30" />
          </feComponentTransfer>
          <feDisplacementMap in="SourceGraphic" in2="stretchedNoise" scale="34" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- Hyper Peripheral Edge Stretch (Extra pronounced prism meniscus) -->
        <filter id="liquid-glass-crystal-edge-bold" x="-25%" y="-25%" width="150%" height="150%">
          <feTurbulence type="fractalNoise" baseFrequency="0.002 0.018" numOctaves="2" result="noise" seed="42" />
          <feComponentTransfer in="noise" result="stretchedNoise">
            <feFuncR type="linear" slope="1.70" intercept="-0.35" />
            <feFuncG type="linear" slope="1.70" intercept="-0.35" />
          </feComponentTransfer>
          <feDisplacementMap in="SourceGraphic" in2="stretchedNoise" scale="38" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- Isotropic Reference (Flat ripple, Edge Stretch Off) -->
        <filter id="liquid-glass-crystal-isotropic" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" result="noise" seed="42" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- 3D Volumetric Lens Depth (Convex Pill Meniscus & Symmetrical Perimeter Refraction) -->
        <filter id="liquid-glass-volumetric-subtle" x="-25%" y="-25%" width="150%" height="150%">
          <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.015" numOctaves="2" result="macroCurvature" seed="77" />
          <feTurbulence type="turbulence" baseFrequency="0.012 0.018" numOctaves="1" result="microRipple" seed="23" />
          <feComposite in="macroCurvature" in2="microRipple" operator="arithmetic" k1="0" k2="0.80" k3="0.20" k4="0" result="combinedLens" />
          <feComponentTransfer in="combinedLens" result="volumetricDisplacement">
            <feFuncR type="linear" slope="1.45" intercept="-0.225" />
            <feFuncG type="linear" slope="1.45" intercept="-0.225" />
          </feComponentTransfer>
          <feDisplacementMap in="SourceGraphic" in2="volumetricDisplacement" scale="18" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <filter id="liquid-glass-volumetric-medium" x="-25%" y="-25%" width="150%" height="150%">
          <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.016" numOctaves="2" result="macroCurvature" seed="77" />
          <feTurbulence type="turbulence" baseFrequency="0.012 0.018" numOctaves="1" result="microRipple" seed="23" />
          <feComposite in="macroCurvature" in2="microRipple" operator="arithmetic" k1="0" k2="0.82" k3="0.22" k4="0" result="combinedLens" />
          <feComponentTransfer in="combinedLens" result="volumetricDisplacement">
            <feFuncR type="linear" slope="1.65" intercept="-0.325" />
            <feFuncG type="linear" slope="1.65" intercept="-0.325" />
          </feComponentTransfer>
          <feDisplacementMap in="SourceGraphic" in2="volumetricDisplacement" scale="26" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <filter id="liquid-glass-volumetric-bold" x="-30%" y="-30%" width="160%" height="160%">
          <feTurbulence type="fractalNoise" baseFrequency="0.002 0.018" numOctaves="3" result="macroCurvature" seed="77" />
          <feTurbulence type="turbulence" baseFrequency="0.014 0.020" numOctaves="1" result="microRipple" seed="23" />
          <feComposite in="macroCurvature" in2="microRipple" operator="arithmetic" k1="0" k2="0.84" k3="0.24" k4="0" result="combinedLens" />
          <feComponentTransfer in="combinedLens" result="volumetricDisplacement">
            <feFuncR type="linear" slope="1.90" intercept="-0.45" />
            <feFuncG type="linear" slope="1.90" intercept="-0.45" />
          </feComponentTransfer>
          <feDisplacementMap in="SourceGraphic" in2="volumetricDisplacement" scale="38" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Navigation SVG Drop Shadow Filters -->
        <filter id="nav-svg-shadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="1.8" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.85" />
        </filter>
        <filter id="nav-svg-shadow-active" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="2.2" stdDeviation="3" flood-color="#000000" flood-opacity="0.95" />
        </filter>

        <!-- Frosted Glass (Soft diffused ripples, milky translucent) -->
        <filter id="liquid-glass-frosted-subtle" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.005 0.005" numOctaves="2" result="noise" seed="17" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="liquid-glass-frosted-medium" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.007 0.007" numOctaves="2" result="noise" seed="17" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="liquid-glass-frosted-bold" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.010 0.010" numOctaves="2" result="noise" seed="17" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Dark Obsidian Smoke (Deep black refractive glass) -->
        <filter id="liquid-glass-darkSmoke-subtle" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.006 0.006" numOctaves="2" result="noise" seed="9" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="liquid-glass-darkSmoke-medium" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" result="noise" seed="9" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="liquid-glass-darkSmoke-bold" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.011 0.011" numOctaves="2" result="noise" seed="9" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="30" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Legacy Standard Aliases -->
        <filter id="liquid-glass" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" result="noise" seed="42" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="liquid-glass-subtle" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.005 0.005" numOctaves="1" result="noise" seed="12" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>

        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem;">Refra — 4K Ad-Free Cinematic Streaming & Anime</h1>
        <p style="font-size: 1.125rem; color: #94a3b8; margin-bottom: 1.5rem;">
          Refra is a modern, minimalist streaming web platform engineered for 4K UHD movies, television series, and Japanese anime with a strict 100% ad-free experience, spatial audio, and Trakt.tv synchronization.
        </p>
        <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem;">Platform Highlights</h2>
        <ul style="list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.5rem; color: #cbd5e1;">
          <li><strong>100% Ad-Free Experience:</strong> Zero commercial interruptions, popups, or intrusive advertisements.</li>
          <li><strong>4K UHD & HDR Resolution:</strong> High-fidelity cinematic streams supporting 4K, HDR, and IMAX Enhanced aspect profiles.</li>
          <li><strong>Spatial Master Audio:</strong> Dolby Atmos 7.1 and multi-channel master audio mixes.</li>
          <li><strong>Complete Anime Library:</strong> Live integration with AniList and MyAnimeList for trending anime and movies.</li>
          <li><strong>Trakt.tv Synchronization:</strong> Track progress, scrobble viewing sessions, and manage watchlists seamlessly.</li>
        </ul>
        <p style="color: #64748b; font-size: 0.875rem;">Please enable JavaScript to launch the full interactive Refra cinematic interface.</p>
